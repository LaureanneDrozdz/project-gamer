name: CI/CD Pipeline
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - frontend
          - backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/${{ matrix.project }}

      - name: Run linting
        run: npm run lint
        working-directory: ${{ github.workspace }}/${{ matrix.project }}

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

  build-and-push-backend:
    name: Build and push backend to Docker Hub
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/project-backend:latest

  build-and-push-frontend:
    name: Build and push frontend to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/project-frontend:latest

  deploy-to-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build-and-push-backend, build-and-push-frontend]
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Log in to Docker Hub (for deploy pulls)
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull backend & frontend images from Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "Pulling backend images..."
          docker pull "$DOCKERHUB_USER/project-backend:latest" || true
          docker pull "$DOCKERHUB_USER/project-backend:$GITHUB_SHA" || true
          echo "Pulling frontend images..."
          docker pull "$DOCKERHUB_USER/project-frontend:latest" || true
          docker pull "$DOCKERHUB_USER/project-frontend:$GITHUB_SHA" || true

      - name: Install Railway CLI
        run: |
          # Install Railway CLI on the Ubuntu runner so we can run `railway up` and `railway run`.
          # Installing via npm is a straightforward approach on the runner.
          npm install -g railway || true

      - name: Trigger Railway deploy
        run: railway up

      - name: Run migrations on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RUN_DB_SEED: ${{ secrets.RUN_DB_SEED }}
        run: |
          # Execute Prisma migrations inside Railway environment to avoid exposing DATABASE_URL
          # This assumes the project is linked in Railway and the default service has node/prisma available
          echo "Running Prisma migrations on Railway..."
          railway run -- npx prisma migrate deploy --preview-feature || true
          if [ "$RUN_DB_SEED" = 'true' ]; then
            echo "Running DB seed on Railway..."
            railway run -- npx prisma db seed || railway run -- node prisma/seed.js || true
          fi

  accessibility:
    runs-on: ubuntu-latest
    needs: deploy-to-railway
    steps:
      - name: Disable AppArmor (required for Chrome)
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if: runner.os == 'Linux'

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start frontend server
        working-directory: frontend
        run: |
          # If Railway provided a deployed frontend URL, Pa11y will target it in a later step.
          # Otherwise serve the downloaded static `out` directory locally.
          if [ -z "${{ secrets.RAILWAY_FRONTEND_URL }}" ]; then
            npm install
            npx serve -s out -l 5173 &
            for i in {1..30}; do
              if curl -s http://localhost:5173 > /dev/null; then
                echo "Server is up!"
                break
              fi
              echo "Waiting for server..."
              sleep 1
            done
          else
            echo "RAILWAY_FRONTEND_URL is set; skipping local serve"
          fi

      - name: Run Pa11y accessibility tests (deployed)
        working-directory: frontend
        run: |
          URL="${{ secrets.RAILWAY_FRONTEND_URL }}"
          echo "Running Pa11y against $URL"
          npx pa11y "$URL" 2>&1 | tee pa11y-report.txt || true

      - name: Run Pa11y accessibility tests (local)
        working-directory: frontend
        run: |
          # Capture Pa11y output to a file for reporting
          npm run pa11y-ci:run 2>&1 | tee pa11y-report.txt || true

      - name: Upload Pa11y report
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-report
          path: frontend/pa11y-report.txt

  lighthouse:
    runs-on: ubuntu-latest
    needs: deploy-to-railway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      - name: Start frontend server
        working-directory: frontend
        run: |
          # If a deployed frontend URL is available, skip local serve and let LHCI target the deployed URL.
          if [ -z "${{ secrets.RAILWAY_FRONTEND_URL }}" ]; then
            npm install
            npx serve -s out -l 5173 &
            for i in {1..30}; do
              if curl -s http://localhost:5173 > /dev/null; then
                echo "Server is up!"
                break
              fi
              echo "Waiting for server..."
              sleep 1
            done
          else
            echo "RAILWAY_FRONTEND_URL is set; skipping local serve"
          fi

      - name: Run Lighthouse CI (deployed)
        working-directory: frontend
        run: |
          URL="${{ secrets.RAILWAY_FRONTEND_URL }}"
          echo "Running LHCI against $URL"
          npx @lhci/cli collect --url="$URL" --config=./.lighthouserc.js 2>&1 | tee lhci-collect.txt || true
          npx @lhci/cli assert --config=./.lighthouserc.js 2>&1 | tee lhci-assert.txt || true

      - name: Run Lighthouse CI (local)
        working-directory: frontend
        run: |
          # collect artifacts and save output
          lhci collect --config=frontend/.lighthouserc.js 2>&1 | tee lhci-collect.txt || true
          lhci assert --config=frontend/.lighthouserc.js 2>&1 | tee lhci-assert.txt || true

      - name: Upload Lighthouse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            frontend/.lighthouseci
            frontend/lhci-collect.txt
            frontend/lhci-assert.txt

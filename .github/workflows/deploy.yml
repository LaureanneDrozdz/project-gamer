name: CI/CD Pipeline
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - frontend
          - backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
         

      - name: Install dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/${{ matrix.project }}

      - name: Run linting
        run: npm run lint
        working-directory: ${{ github.workspace }}/${{ matrix.project }}

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

  start-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Start backend
        working-directory: backend
        run: |
          # start backend in background and wait until it responds on the expected port
          npm run start &
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Backend is up!"
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

  build-frontend:
    runs-on: ubuntu-latest
    needs: [lint, start-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build
        working-directory: frontend
        run: |
          npm install
          npm run build
          # If the site can be exported statically, export to `out` so we can serve it in later jobs
          npm run export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          SERVER_API_URL: ${{ secrets.SERVER_API_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_RAWG_API_KEY: ${{ secrets.NEXT_PUBLIC_RAWG_API_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          # upload the static export directory so accessibility/lighthouse can serve it
          path: frontend/out

  accessibility:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Disable AppArmor (required for Chrome)
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if: runner.os == 'Linux'

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out

      - name: Start frontend server
        working-directory: frontend
        run: |
          # `out` was downloaded by the previous step; serve it using npx to avoid global installs
          npm install
          npx serve -s out -l 5173 &
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done

      - name: Run Pa11y accessibility tests
        run: npm run pa11y-ci:run
        working-directory: frontend

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out

      - name: Start frontend server
        working-directory: frontend
        run: |
          npm install
          npx serve -s out -l 5173 &
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done

      - name: Run Lighthouse CI
        run: |
          lhci collect --config=frontend/.lighthouserc.js
          lhci assert --config=frontend/.lighthouserc.js

  deploy:
    runs-on: ubuntu-latest
    needs: [accessibility, lighthouse]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend for GitHub Pages
        working-directory: frontend
        run: |
          npm install
          npm run build
          # produce static export to `out` for GitHub Pages
          npm run export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RAWG_API_KEY: ${{ secrets.NEXT_PUBLIC_RAWG_API_KEY }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  
  
